<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>1arutyun</title>
  <meta name="description" content="Official personal page of 1arutyun. Releases, visuals, and thoughts.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <!-- Minimalist Top Header (No visible Admin button — matches reference screenshot) -->
  <header class="site-header" id="site-header">
    <div class="header-bar">
      <a href="/" class="brand-link" data-route="/">
        <img src="assets/logo_or_avatar.jpg" alt="1arutyun" class="brand-avatar" id="header-avatar">
        <span id="header-brand-name">1arutyun</span>
      </a>

      <div class="header-right">
        <nav class="main-nav" id="main-nav">
          <a href="/" class="nav-item active" data-route="/" data-i18n="navMain">Main Page</a>
          <a href="/videos" class="nav-item" data-route="/videos" data-i18n="navVideos">Videos</a>
          <a href="/thoughts" class="nav-item" data-route="/thoughts" data-i18n="navThoughts">Thoughts</a>
        </nav>

        <div class="header-controls">
          <!-- Theme Toggle (Default: Light, switchable to Dark) -->
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light / Dark theme" aria-label="Toggle theme">
            <span id="theme-icon"></span>
          </button>

          <!-- Mobile Menu Button -->
          <button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Dynamic Seamless Page View Container -->
  <main id="app-root" class="page-view"></main>

  <!-- Minimalist Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-row">
        <div id="footer-copy">© 2026 1arutyun</div>
        <div id="footer-socials" style="display:flex;gap:16px;align-items:center;"></div>
      </div>
    </div>
  </footer>

  <!-- Fallback default data + translations + main app -->
  <script src="js/default-data.js?v=5"></script>
  <script src="js/translations.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
